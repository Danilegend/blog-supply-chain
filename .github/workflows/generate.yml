name: Generate Draft Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the post'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }} 
          TOPIC: ${{ inputs.topic }}
        run: python scripts/generate_post.py --topic "$TOPIC"

      - name: Commit draft and open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="draft/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add src/content/posts
          git commit -m "draft: $TOPIC"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Draft: $TOPIC" \
            --body "Generated by workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Review the markdown under \`src/content/posts/\`, then **merge this PR** to publish.")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf '📝 <b>New draft ready</b>\n\n<b>Topic:</b> %s\n\n<a href="%s">Review the PR →</a>' \
              "$TOPIC" "$PR_URL" > /tmp/msg.txt
          else
            printf '⚠️ <b>Generation failed</b>\n\n<b>Topic:</b> %s\n\n<a href="%s">See the run →</a>' \
              "$TOPIC" "$RUN_URL" > /tmp/msg.txt
          fi
          python scripts/notify_telegram.py --message "$(cat /tmp/msg.txt)"

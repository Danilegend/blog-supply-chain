name: Generate Draft Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the post'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          TOPIC: ${{ inputs.topic }}
        run: python scripts/generate_post.py --topic "$TOPIC"

      - name: Commit draft and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="draft/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add src/content/posts
          git commit -m "draft: $TOPIC"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Draft: $TOPIC" \
            --body "Generated by workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Review the markdown under \`src/content/posts/\`, then **merge this PR** to publish. Deploy triggers automatically on merge."
